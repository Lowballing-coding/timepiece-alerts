<!doctype html>
<html lang="en">
<head>

<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; img-src 'self'; script-src 'none'; base-uri 'self'; object-src 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page Not Found | TP Notify</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#faf9f5">

<link rel="icon" href="https://lowballing-coding.github.io/timepiece-alerts/icon-192.png">
<style>
  :root { --bg: #faf9f5; --text: #141413; --muted: #65635d; --fill: #b5593b; --accent: #a9583e; }
  @media (prefers-color-scheme: dark) { :root { --bg: #181715; --text: #faf9f5; --muted: #a09d96; --accent: #e39679; } }
  body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.5 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 480px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 72px) 20px 40px; text-align: center; }
  h1 { font: 400 34px/1.1 ui-serif, "New York", Georgia, serif; letter-spacing: -.5px; margin: 0; }
  p { color: var(--muted); font-size: 15px; margin: 12px 0 0; }
  a.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 50px; padding: 0 28px; margin-top: 28px; border-radius: 8px;
    background: var(--fill); color: #fff; font-weight: 500; text-decoration: none; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
<h1>Page Not Found</h1>

<a class="btn" href="https://lowballing-coding.github.io/timepiece-alerts/">Open TP Notify</a>
<p>Need help? Email <a href="mailto:TPNotify@outlook.com">TPNotify@outlook.com</a>.</p>
</main>
